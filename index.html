<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciclo</title>
<meta name="theme-color" content="#F3F5F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ciclo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Ciclo: papel frío, tinta azul noche y un único acento cobalto reservado para lo que toca ahora.
     Layout: una columna de móvil; el anillo del día es el protagonista y todo lo demás se calla. */
  --paper:#F3F5F9;
  --surface:#FFFFFF;
  --ink:#131A2C;
  --muted:#6A7387;
  --line:#E1E5EE;
  --accent:#2C47F5;
  --accent-soft:#AEBBFF;
  --accent-wash:#ECEFFF;
  --dusk:#1C2445;
  --font:"Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
svg{display:block}
.ico svg,.hicon svg,.opt svg,.navb svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--paper);overflow:hidden;overflow:clip}
@media (min-width:600px){body{background:#E9ECF2}.app{box-shadow:0 0 0 1px var(--line)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);overflow:hidden;overflow:clip}

/* ---------- Vistas ---------- */
.views{position:relative;flex:1;overflow:hidden;overflow:clip}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 20px calc(110px + env(safe-area-inset-bottom));opacity:0;transform:translateX(18px);pointer-events:none;visibility:hidden;transition:opacity .35s var(--ease),transform .5s var(--ease),visibility 0s .5s;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.on{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity .35s var(--ease),transform .5s var(--ease)}
.view.left{transform:translateX(-18px)}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:34px}
.date{display:block;font-size:14px;color:var(--muted)}
.date::first-letter{text-transform:uppercase}
.tbtn{flex:none;font-size:13px;font-weight:500;color:var(--muted);padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface)}

/* Anillo del día */
.ringwrap{position:relative;width:236px;height:236px;margin:14px auto 6px}
.ringwrap svg{width:100%;height:100%;overflow:visible}
.breathe{transform-origin:130px 130px;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
.trk{fill:none;stroke:var(--line);stroke-width:14;stroke-linecap:round}
.fil{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease),stroke .4s,opacity .3s}
.fil.min{stroke:var(--accent-soft)}
.paused .trk{stroke-dasharray:2 9 !important;stroke-width:3}
.paused .fil{opacity:0 !important}
.halo{fill:var(--accent-wash);opacity:0;transform-origin:130px 130px}
.ringwrap.burst .halo{animation:halo 1.4s var(--ease)}
@keyframes halo{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.35)}}
.dot{transform-box:fill-box;transform-origin:center;animation:pop .6s var(--spring) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.center{position:absolute;inset:44px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:background .3s}
.center:active{background:var(--accent-wash)}
.wlabel{font-size:11px;color:var(--muted);margin-bottom:4px}
.word{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.05;max-width:130px;overflow-wrap:anywhere;animation:wordIn 1.2s .5s var(--ease) both}
@keyframes wordIn{from{opacity:0;filter:blur(6px);transform:translateY(6px)}to{opacity:1;filter:none;transform:none}}
.count{font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* Tarjeta de "ahora" */
.now{margin-top:14px;padding:18px;border-radius:24px;background:var(--accent);color:#fff;position:relative;overflow:hidden;animation:rise .6s var(--ease) both}
.now>*{position:relative;z-index:1}
.now::after{content:"";z-index:0;position:absolute;width:180px;height:180px;border-radius:50%;border:24px solid rgba(255,255,255,.08);right:-60px;top:-70px}
.now small{font-size:13px;opacity:.8}
.now h3{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:2px 0 4px}
.now p{font-size:14px;opacity:.85;max-width:30ch}
.now button{margin-top:14px;background:#fff;color:var(--accent);font-weight:600;font-size:15px;padding:11px 18px;border-radius:16px;transition:transform .2s var(--spring)}
.now button:active{transform:scale(.96)}
.now.calm{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.now.calm::after{border-color:var(--accent-wash)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.banner{margin-top:14px;animation:rise .6s var(--ease) both}
.banner h2{text-wrap:balance;font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.banner p{color:var(--muted);margin-top:4px;font-size:15px}
.note{margin-top:12px;padding:14px 16px;border-left:3px solid var(--accent-soft);background:var(--surface);border-radius:4px 16px 16px 4px;font-size:15px;animation:rise .7s .1s var(--ease) both}
.note small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.link{margin-top:14px;font-size:14px;color:var(--accent);font-weight:500}
.flag{display:block;width:100%;text-align:left;margin-top:14px;padding:12px 14px;border-radius:18px;background:var(--accent-wash);color:var(--accent);font-size:14px;font-weight:500}

/* Hábitos */
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.habit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);transition:transform .25s var(--spring),border-color .25s}
.habit:active{transform:scale(.98)}
.hicon{width:38px;height:38px;border-radius:12px;background:var(--paper);display:grid;place-items:center;flex:none;color:var(--ink)}
.hicon svg{width:22px;height:22px}
.htext{flex:1;min-width:0}
.hname{display:block;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsub{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hstate{width:28px;height:28px;border-radius:50%;border:1.6px solid var(--line);display:grid;place-items:center;flex:none;transition:all .35s var(--spring)}
.hstate svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .5s .1s var(--ease)}
.hstate.full{background:var(--accent);border-color:var(--accent)}
.hstate.min{background:var(--accent-soft);border-color:var(--accent-soft)}
.hstate.full svg,.hstate.min svg{stroke-dashoffset:0}
.cierre{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;margin-top:18px;padding:14px 4px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.cierre b{color:var(--ink);font-weight:500}
.cierre .go{flex:none}
.cierre.due .go{color:var(--accent);font-weight:600}
.cierre.closed .go{color:var(--accent)}

/* Navegación y Vuelve */
.vuelve{align-self:center;flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px 10px 12px;border-radius:24px;background:var(--surface);border:1px solid var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;box-shadow:0 10px 30px -12px rgba(44,71,245,.45);transition:transform .25s var(--spring)}
.vuelve:active{transform:scale(.95)}
.vuelve .pulse{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent);position:relative}
.vuelve .pulse::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--accent);opacity:0;animation:ripple 3.2s ease-out infinite}
@keyframes ripple{0%{opacity:.6;transform:scale(.6)}70%,100%{opacity:0;transform:scale(1.3)}}
.nav{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:2px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 70%,rgba(243,245,249,0))}
.navb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:6px 4px;position:relative;transition:color .25s}
.navb svg{width:24px;height:24px}
.navb.on{color:var(--ink);font-weight:600}
.navb::after{content:"";position:absolute;bottom:-2px;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .35s var(--spring)}
.navb.on::after{transform:scale(1)}

/* Semana */
.h{font-size:30px;font-weight:600;letter-spacing:-.03em;margin-top:6px}
.sub{color:var(--muted);font-size:15px;margin-top:4px;max-width:34ch}
.days{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.drow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);animation:rise .5s var(--ease) both}
.drow.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.drow.past{opacity:.6}
.dname{font-size:13px;color:var(--muted);line-height:1.1}
.dname b{display:block;font-size:20px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dmid{min-width:0}
.dmid input{width:100%;border:0;background:transparent;font-weight:600;font-size:16px;padding:2px 0;border-bottom:1px dashed transparent;border-radius:0;transition:border-color .2s}
.dmid input:focus{outline:none;border-bottom-color:var(--accent)}
.dmid input::placeholder{color:var(--accent-soft);font-weight:500}
.dmid small{display:block;font-size:12px;color:var(--muted)}
.dmov{width:34px;height:34px;border-radius:11px;background:var(--paper);display:grid;place-items:center;color:var(--muted)}
.dmov svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.foot{font-size:13px;color:var(--muted);margin-top:14px}

/* Ciclo */
.prog{height:6px;border-radius:3px;background:var(--line);margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transform-origin:left;animation:grow 1.1s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.mosaic{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;margin-top:16px}
.mosaic .wd{font-size:11px;color:var(--muted);text-align:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;animation:pop .5s var(--spring) both}
.cell svg{width:34px;height:34px}
.cell span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.today span{color:var(--accent);font-weight:700}
.sec{margin-top:26px}
.sec h3{font-size:17px;font-weight:600;margin-bottom:10px}
.stat{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0}
.stat .ico svg{width:22px;height:22px}
.stat b{font-weight:500}
.stat em{font-style:normal;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:2/4;height:6px;border-radius:3px;background:var(--line);display:flex;overflow:hidden}
.bar i{height:100%;animation:grow 1s var(--ease) both;transform-origin:left}
.bar .f{background:var(--accent)}.bar .m{background:var(--accent-soft)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;min-width:0}
.tile b{display:block;font-size:20px;white-space:nowrap;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.wait{display:flex;gap:8px;flex-wrap:wrap}
.wait span{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-size:14px}
.wait svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notes p{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.endcard{margin-top:16px;padding:18px;border-radius:24px;background:var(--accent);color:#fff;animation:rise .6s var(--ease) both}
.endcard h3{font-size:20px;font-weight:600}
.endcard p{font-size:14px;opacity:.85;margin-top:4px}
.endcard button{margin-top:14px;background:#fff;color:var(--accent);font-weight:600;padding:11px 18px;border-radius:16px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{padding:11px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:14px}

/* Hojas, capas */
.backdrop{position:absolute;inset:0;z-index:20;background:rgba(19,26,44,.3);opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:21;background:var(--surface);border-radius:30px;padding:10px 20px calc(18px + env(safe-area-inset-bottom));transform:translateY(115%);visibility:hidden;transition:transform .55s var(--spring),visibility 0s .55s;max-height:86%;overflow-y:auto;overscroll-behavior:contain}
.sheet.on{transform:none;visibility:visible;transition:transform .55s var(--spring)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:22px;font-weight:600;letter-spacing:-.02em}
.sheet .sp{color:var(--muted);font-size:14px;margin:2px 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;border-radius:18px;background:var(--paper);font-weight:500;text-align:left;transition:transform .2s var(--spring)}
.opt:active{transform:scale(.97)}
.opt small{color:var(--muted);font-weight:400;font-size:13px}
.opt.pri{background:var(--accent);color:#fff}
.opt.pri small{color:rgba(255,255,255,.75)}
.opt.ghost{background:transparent;color:var(--muted);justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:16px;background:var(--paper);font-weight:500;font-size:15px;transition:transform .2s var(--spring),background .2s,color .2s}
.chip:active{transform:scale(.94)}
.chip.sel{background:var(--accent);color:#fff}
.ov .chip{background:var(--surface);border:1px solid var(--line)}
.ov .chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.field{width:100%;margin-top:10px;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--paper);font-size:16px}
.field:focus{outline:none;border-color:var(--accent)}
textarea.field{min-height:120px;resize:none;font-size:13px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big2 button{padding:26px 10px;border-radius:22px;font-size:20px;font-weight:600;background:var(--paper);transition:transform .25s var(--spring)}
.big2 button:first-child{background:var(--accent);color:#fff}
.big2 button:active{transform:scale(.95)}

.ov{position:absolute;inset:0;z-index:30;background:var(--paper);opacity:0;transform:scale(1.03);pointer-events:none;visibility:hidden;transition:opacity .4s var(--ease),transform .5s var(--ease),visibility 0s .5s;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));overflow-y:auto}
.ov.on{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity .4s var(--ease),transform .5s var(--ease)}
.ovh{display:flex;justify-content:flex-end;min-height:40px;margin-bottom:8px}
.ov .x{font-size:14px;font-weight:500;color:var(--muted);padding:8px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.ov h2{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
.ov .sp{color:var(--muted);margin-top:6px}
.ov .grow{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:16px 0}
.ov .actions{display:flex;gap:10px;margin-top:12px}
.ov .actions button{flex:1;padding:16px;text-align:center;border-radius:18px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.ov .actions .pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.step{animation:rise .5s var(--ease) both;display:flex;flex-direction:column;flex:1}
.ctr{text-align:center;align-self:stretch}
.welcome ul{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:22px}
.welcome li{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;font-size:15px}
.welcome li b{display:block;font-weight:600}
.welcome li span{color:var(--muted)}
.welcome li b{color:var(--ink)}
.welcome .hicon{color:var(--ink)}

.tring{width:250px;height:250px;position:relative}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tring .t b{font-size:54px;font-weight:300;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tring .t span{font-size:14px;color:var(--muted)}
.minok{margin-top:18px;padding:8px 14px;border-radius:20px;background:var(--accent-wash);color:var(--accent);font-weight:600;font-size:14px;opacity:0;transform:scale(.8);transition:all .5s var(--spring)}
.minok.on{opacity:1;transform:none}

.orb{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#6E83FF,var(--accent) 70%);transform:scale(.5);box-shadow:0 30px 60px -20px rgba(44,71,245,.55)}
.orbwrap{position:relative;width:260px;height:260px;display:grid;place-items:center}
.orbwrap::before{content:"";position:absolute;inset:10px;border-radius:50%;border:1.5px dashed var(--accent-soft)}
.blabel{margin-top:22px;font-size:22px;font-weight:500;letter-spacing:-.02em;min-height:30px}
.bmeta{color:var(--muted);font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}

.ov.night{background:linear-gradient(180deg,#121933,var(--dusk) 60%,#2A3463);color:#E8ECFF}
.ov.night .sp{color:#9AA5D6}
.moon{width:120px;height:120px;border-radius:50%;box-shadow:inset 18px -10px 0 0 #DCE2FF;transform:rotate(-20deg);animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:rotate(-20deg) translateY(-8px)}}
.night h2{font-size:44px;margin-top:36px}
.night .open{margin-top:12px;font-size:14px;color:#9AA5D6;text-decoration:underline;text-underline-offset:3px;align-self:center;padding:8px}

.toast{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:50;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:500;max-width:calc(100% - 40px);text-align:center;transition:all .45s var(--spring);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app">
  <div class="screen">
    <div class="views">
      <section class="view on" id="v-hoy" aria-label="Hoy">
        <div class="top"><span class="date" id="date"></span><button class="tbtn" data-a="pause" id="pauseBtn">Pausar hoy</button></div>
        <div class="ringwrap" id="ringwrap">
          <svg viewBox="0 0 260 260" aria-hidden="true">
            <circle class="halo" cx="130" cy="130" r="118"/>
            <g class="breathe" id="ringg"></g>
          </svg>
          <button class="center" data-a="checkin" aria-label="Responder: ¿estás aquí?">
            <span class="wlabel">Tu palabra de hoy</span>
            <span class="word" id="word"></span>
            <span class="count" id="count"></span>
          </button>
        </div>
        <div id="hoyBody"></div>
      </section>
      <section class="view" id="v-semana" aria-label="Semana"></section>
      <section class="view" id="v-ciclo" aria-label="Ciclo"></section>
    </div>
    <nav class="nav">
      <button class="navb on" data-a="tab" data-t="hoy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 6.9 12"/></svg>Hoy</button>
      <button class="navb" data-a="tab" data-t="semana"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Semana</button>
      <button class="navb" data-a="tab" data-t="ciclo"><svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><circle cx="7" cy="17" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>Ciclo</button>
      <button class="vuelve" data-a="vuelve" aria-label="Vuelve: un minuto para volver al presente"><span class="pulse"></span>Vuelve</button>
    </nav>
    <div class="backdrop" id="backdrop" data-a="closeSheet"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    <div class="ov" id="ov" role="dialog" aria-modal="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const HK = ['med', 'est', 'mov'];
const ICON = {
  med: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg>',
  est: '<svg viewBox="0 0 24 24"><path d="M3.5 5.5c3-1 6-1 8.5.8 2.5-1.8 5.5-1.8 8.5-.8v13c-3-1-6-1-8.5.8-2.5-1.8-5.5-1.8-8.5-.8z"/><path d="M12 6.3v13"/></svg>',
  bici: '<svg viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.6"/><circle cx="18" cy="16" r="3.6"/><path d="M6 16l4-7h5l3 7M10 9l2 7M13.5 6h2.5"/></svg>',
  gym: '<svg viewBox="0 0 24 24"><path d="M3 9.5v5M6 7v10M18 7v10M21 9.5v5M6 12h12"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5.5 12.5l4 4 9-9.5"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};
const MOV = {
  bici: { name: 'Bici', full: '30 min', min: '15 min' },
  gym: { name: 'Gimnasio', full: '45 min', min: '15 min' }
};
const FEEL = ['Agobio', 'Ansiedad', 'Cansancio', 'Aburrimiento', 'Tristeza', 'Vacío', 'Rabia', 'Inquietud', 'Calma', 'Ilusión'];
const WORDS = ['Calma', 'Foco', 'Paciencia', 'Presente', 'Despacio', 'Respira', 'Aquí', 'Escucha', 'Suelta', 'Firme', 'Cuerpo', 'Ahora', 'Sencillo', 'Constante', 'Ligero', 'Mira', 'Siente', 'Agradece', 'Atento', 'Raíz', 'Claridad', 'Paso a paso'];
const ACTS = ['Abrir los apuntes', 'Estirarte 2 minutos', 'Salir a que te dé el aire', 'Beber un vaso de agua', 'Ordenar la mesa'];
const STUDY_FULL = 3000, STUDY_MIN = 600;

/* ---------- Fechas (se recalculan si cambia el día con la app abierta) ---------- */
const day0 = (d = new Date()) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const add = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const diff = (a, b) => Math.round((day0(b) - day0(a)) / 864e5);
let TODAY = day0(), TK = key(TODAY);
const wordOf = k => { let h = 7; for (const c of k) h = (h * 31 + c.charCodeAt(0)) >>> 0; return WORDS[h % WORDS.length]; };

/* ---------- Estado ---------- */
const LS = 'ciclo-data';
let S, nightBypassDay = '', showAll = false;
const fresh = () => ({
  v: 1, since: TK, cycle: 1, cycleStart: TK, days: {}, notes: [], firstMov: 'bici',
  plan: { 0: '', 1: '', 2: '', 3: '', 4: '', 5: '', 6: '' },
  reentry: null, lastOpen: TK, timer: null, lastPrompt: 0, welcomed: false
});
function load() {
  try { const x = JSON.parse(localStorage.getItem(LS)); if (x && x.days && x.v === 1) return Object.assign(fresh(), x); } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast('No se ha podido guardar. Revisa el espacio del iPhone.'); } }
const blank = () => ({ h: { med: null, est: null, mov: null }, pres: [], line: '', pause: false, closed: false });
function rec(k) { if (!S.days[k]) S.days[k] = blank(); return S.days[k]; }
const T = () => rec(TK);
const done = r => r ? HK.filter(h => r.h[h]).length : 0;

function movFor(k) {
  const r = S.days[k];
  if (r && r.h.mov && r.movType) return r.movType;
  if (r && r.movOverride) return r.movOverride;
  const keys = Object.keys(S.days).filter(x => x < k).sort().reverse();
  for (const x of keys) { const d = S.days[x]; if (d.h.mov && d.movType) return d.movType === 'bici' ? 'gym' : 'bici'; }
  return S.firstMov || 'bici';
}
const isNightHour = () => { const h = new Date().getHours(); return h >= 22 || h < 6; };
function mode() {
  if (S.reentry && S.reentry.until >= TK && S.reentry.start <= TK) return 'reentrada';
  const yk = key(add(TODAY, -1));
  if (yk >= S.since) { const y = S.days[yk]; if (!(y && y.pause) && done(y) === 0) return 'regreso'; }
  return 'normal';
}
const subjectToday = () => S.plan[TODAY.getDay()] || '';
const cycleDay = () => diff(fromKey(S.cycleStart), TODAY) + 1;

/* ---------- Anillo ---------- */
const R = 104, C = 2 * Math.PI * R, GAP = 16, SEG = C / 3 - GAP;
function buildRing() {
  let html = '';
  HK.forEach((h, i) => {
    const a = -90 + i * 120 + (GAP / 2) / C * 360;
    html += `<circle class="trk" cx="130" cy="130" r="${R}" stroke-dasharray="${SEG} ${C}" transform="rotate(${a} 130 130)"/>`;
    html += `<circle class="fil" id="f-${h}" cx="130" cy="130" r="${R}" stroke-dasharray="${SEG} ${C}" stroke-dashoffset="${SEG}" transform="rotate(${a} 130 130)" style="opacity:0"/>`;
  });
  $('#ringg').innerHTML = html + '<g id="dots"></g>';
}
let lastDone = -1;
function updateRing() {
  const t = T();
  $('#ringwrap').classList.toggle('paused', !!t.pause);
  HK.forEach(h => {
    const el = $('#f-' + h), v = t.h[h];
    el.classList.toggle('min', v === 'min');
    el.style.opacity = v ? 1 : 0;
    el.setAttribute('stroke-dashoffset', v ? 0 : SEG);
  });
  const n = done(t);
  const w = $('#word'), word = wordOf(TK);
  if (w.textContent !== word) w.textContent = word;
  $('#count').textContent = t.pause ? 'Día en pausa' : n === 3 ? 'Hecho por hoy' : `${n} de 3`;
  let dots = '';
  const p = t.pres, step = 9;
  p.forEach((d, k) => {
    const a = (-90 - ((p.length - 1) * step) / 2 + k * step) * Math.PI / 180;
    const x = (130 + 126 * Math.cos(a)).toFixed(1), y = (130 + 126 * Math.sin(a)).toFixed(1);
    dots += d.t === 'aqui'
      ? `<circle class="dot" cx="${x}" cy="${y}" r="4.2" fill="var(--accent)" style="animation-delay:${k * 80}ms"/>`
      : `<circle class="dot" cx="${x}" cy="${y}" r="3.4" fill="none" stroke="var(--muted)" stroke-width="1.4" style="animation-delay:${k * 80}ms"/>`;
  });
  $('#dots').innerHTML = dots;
  if (n === 3 && lastDone !== -1 && lastDone < 3) {
    const rw = $('#ringwrap'); rw.classList.remove('burst'); void rw.offsetWidth; rw.classList.add('burst');
    if (navigator.vibrate) try { navigator.vibrate(20); } catch (e) {}
  }
  lastDone = n;
}

/* ---------- Hoy ---------- */
function habitInfo(h) {
  if (h === 'med') return { name: 'Meditar', icon: ICON.med, sub: 'Con el café · 5 min', full: '5 min', min: '3 respiraciones' };
  if (h === 'est') { const s = subjectToday(); return { name: 'Estudio', icon: ICON.est, sub: `Después de comer · ${s || '50 min'}`, full: '50 min', min: '10 min' }; }
  const m = movFor(TK), o = MOV[m];
  return { name: o.name, icon: ICON[m], sub: `${o.full} · mañana, ${m === 'bici' ? 'gimnasio' : 'bici'}`, full: o.full, min: o.min };
}
function habitRow(h, i) {
  const v = T().h[h], inf = habitInfo(h);
  return `<button class="habit" data-a="habit" data-h="${h}" style="animation:rise .5s ${i * 60}ms var(--ease) both">
    <span class="hicon">${inf.icon}</span>
    <span class="htext"><span class="hname">${inf.name}</span><span class="hsub">${esc(inf.sub)}</span></span>
    <span class="hstate ${v || ''}" aria-label="${v === 'full' ? 'Hecho' : v === 'min' ? 'Mínimo hecho' : 'Pendiente'}">${ICON.check}</span></button>`;
}
const list = () => `<div class="list">${HK.map(habitRow).join('')}</div>`;
function noteCard() {
  if (!S.notes.length) return '';
  const n = S.notes[Math.floor(Math.random() * S.notes.length)];
  return `<div class="note"><small>Te lo escribiste un día bueno</small>«${esc(n.text)}»</div>`;
}
function nextAction() {
  const t = T(), order = new Date().getHours() < 12 ? ['med', 'est', 'mov'] : ['est', 'mov', 'med'];
  return order.find(x => !t.h[x]);
}
function nowCard() {
  const n = nextAction();
  if (!n) return `<div class="now calm"><small>Hoy</small><h3>Todo hecho.</h3><p>Lo que queda del día es tuyo.</p></div>`;
  if (n === 'est') { const s = subjectToday(); return `<div class="now"><small>Ahora toca</small><h3>Estudio${s ? ': ' + esc(s) : ''}</h3><p>Bloque de 50 minutos. Si hoy cuesta, con 10 basta.</p><button data-a="study">Empezar bloque</button></div>`; }
  if (n === 'med') return `<div class="now"><small>Ahora toca</small><h3>Meditar</h3><p>Cinco minutos con el café. Si no, tres respiraciones.</p><button data-a="habit" data-h="med">Marcar</button></div>`;
  const m = MOV[movFor(TK)];
  return `<div class="now"><small>Ahora toca</small><h3>${m.name}</h3><p>${m.full}. El mínimo, ${m.min}.</p><button data-a="habit" data-h="mov">Marcar</button></div>`;
}
function cierreRow() {
  const t = T(), h = new Date().getHours();
  if (t.closed) return `<button class="cierre closed" data-a="cierre"><span><b>Día cerrado</b><br>Puedes cambiar algo si quieres</span><span class="go">Abrir</span></button>`;
  return `<button class="cierre ${h >= 21 ? 'due' : ''}" data-a="cierre"><span><b>Cierre del día</b><br>30 segundos, a las 21:30</span><span class="go">Hacer ahora</span></button>`;
}
function renderHoy() {
  const t = T(), md = mode();
  $('#date').textContent = TODAY.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#pauseBtn').textContent = t.pause ? 'Quitar pausa' : 'Pausar hoy';
  $('#pauseBtn').dataset.a = t.pause ? 'unpause' : 'pause';
  let html = '';
  if (cycleDay() > 28) html += `<button class="flag" data-a="tab" data-t="ciclo">Tu ciclo ${S.cycle} ha terminado. Ciérralo en Ciclo.</button>`;
  if (t.pause) {
    html += `<div class="banner"><h2>Día en pausa.</h2><p>${t.reason ? esc(t.reason) + '. ' : ''}No cuenta como fallo. Mañana seguimos.</p></div>`;
  } else if (md === 'regreso' || md === 'reentrada') {
    const ok = !!t.h.est;
    if (md === 'regreso') {
      html += ok
        ? `<div class="banner"><h2>Hecho. Cadena cortada.</h2><p>Un día malo se queda en uno. Lo demás, si sale.</p></div>${list()}`
        : `<div class="banner"><h2>Ayer no salió.<br>Hoy, solo esto.</h2></div>`;
    } else {
      const n = diff(fromKey(S.reentry.start), TODAY) + 1;
      html += ok
        ? `<div class="banner"><h2>Hecho.</h2><p>Día ${n} de 3 de vuelta. ${n < 3 ? 'Mañana, otra vez lo mínimo.' : 'Mañana, vuelta a lo normal.'}</p></div>`
        : `<div class="banner"><h2>Has vuelto.</h2><p>Empezamos por lo mínimo. Día ${n} de 3: una sola cosa al día.</p></div>`;
    }
    if (!ok) {
      const s = subjectToday();
      html += `<div class="now"><small>Lo único de hoy</small><h3>10 minutos de estudio</h3><p>Abre los apuntes${s ? ' de ' + esc(s) : ''}. Si sigues, mejor; si no, cuenta igual.</p><button data-a="study">Empezar</button></div>${noteCard()}`;
    }
    if (!(md === 'regreso' && ok)) html += showAll ? list() : `<button class="link" data-a="showAll">Ver el resto de hábitos</button>`;
  } else {
    html += nowCard() + list();
  }
  html += cierreRow();
  $('#hoyBody').innerHTML = html;
  updateRing();
}

/* ---------- Semana ---------- */
function renderSemana() {
  const dow = (TODAY.getDay() + 6) % 7, mon = add(TODAY, -dow);
  let mv = movFor(TK), rows = '';
  for (let i = 0; i < 7; i++) {
    const d = add(mon, i), k = key(d), wd = d.getDay(), we = wd === 0 || wd === 6;
    const past = k < TK, today = k === TK;
    let m = null;
    if (past) m = S.days[k] && S.days[k].h.mov ? S.days[k].movType : null;
    else if (today) m = mv;
    else { mv = mv === 'bici' ? 'gym' : 'bici'; m = mv; }
    const name = d.toLocaleDateString('es-ES', { weekday: 'short' }).replace('.', '');
    rows += `<div class="drow ${today ? 'today' : ''} ${past ? 'past' : ''}" style="animation-delay:${i * 50}ms">
      <div class="dname">${name}<b>${d.getDate()}</b></div>
      <div class="dmid"><input id="plan-${wd}" data-wd="${wd}" value="${esc(S.plan[wd] || '')}" placeholder="${we ? 'Ligero: ¿algo?' : '¿Qué estudias?'}" aria-label="Estudio del ${name}" enterkeyhint="done" autocomplete="off"><small>${we ? 'Versión ligera, sin hora' : 'Después de comer'}</small></div>
      <div class="dmov" title="${m ? MOV[m].name : 'Sin movimiento'}">${m ? ICON[m] : ''}</div></div>`;
  }
  $('#v-semana').innerHTML = `<div class="top"></div><h2 class="h">Semana</h2>
    <p class="sub">Qué estudias cada día. Toca un día para escribirlo; el domingo es buen momento para rellenarlo.</p>
    <div class="days">${rows}</div>
    <p class="foot">Bici y gimnasio se alternan solos. Si un día no puedes, el que tocaba pasa al siguiente.</p>`;
}

/* ---------- Ciclo ---------- */
function mini(r, state) {
  const rr = 14, c = 2 * Math.PI * rr, g = 4, sg = c / 3 - g;
  let s = '';
  HK.forEach((h, i) => {
    const a = -90 + i * 120 + (g / 2) / c * 360;
    let col = state === 'future' ? '#EBEEF4' : 'var(--line)';
    if (state === 'pause') col = 'var(--muted)';
    if (r && !r.pause && r.h[h]) col = r.h[h] === 'full' ? 'var(--accent)' : 'var(--accent-soft)';
    const da = state === 'pause' ? '1.5 4' : `${sg} ${c}`;
    s += `<circle cx="18" cy="18" r="${rr}" fill="none" stroke="${col}" stroke-width="${state === 'pause' ? 1.5 : 4}" stroke-linecap="round" stroke-dasharray="${da}" transform="rotate(${a} 18 18)"/>`;
  });
  if (state === 'today') s += '<circle cx="18" cy="18" r="5" fill="var(--accent)"/>';
  return `<svg viewBox="0 0 36 36">${s}</svg>`;
}
function renderCiclo() {
  const start = fromKey(S.cycleStart), dayN = cycleDay(), ended = dayN > 28, shown = Math.min(dayN, 28), week = Math.min(4, Math.ceil(shown / 7));
  let cells = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(x => `<span class="wd">${x}</span>`).join('');
  const off = (start.getDay() + 6) % 7;
  for (let i = 0; i < off; i++) cells += '<span></span>';
  const st = { med: [0, 0], est: [0, 0], mov: [0, 0] };
  let counted = 0, estMin = 0, bici = 0, gym = 0, aq = 0, tot = 0;
  for (let i = 0; i < 28; i++) {
    const d = add(start, i), k = key(d), r = S.days[k];
    const state = k > TK ? 'future' : k === TK ? 'today' : r && r.pause ? 'pause' : 'past';
    cells += `<div class="cell ${state}" style="animation-delay:${i * 18}ms">${mini(r, state)}<span>${d.getDate()}</span></div>`;
    if (k > TK) continue;
    if (r) r.pres.forEach(p => { if (p.via === 'vuelve') return; tot++; if (p.t === 'aqui') aq++; });
    if (r && r.pause) continue;
    if (k < TK || done(r)) {
      counted++;
      if (r) {
        HK.forEach(h => { if (r.h[h] === 'full') st[h][0]++; else if (r.h[h] === 'min') st[h][1]++; });
        estMin += r.estMin || (r.h.est === 'full' ? 50 : r.h.est === 'min' ? 10 : 0);
        if (r.h.mov) r.movType === 'gym' ? gym++ : bici++;
      }
    }
  }
  const names = { med: ['Meditar', ICON.med], est: ['Estudio', ICON.est], mov: ['Movimiento', ICON.bici] };
  const stats = HK.map((h, i) => {
    const [f, m] = st[h], pf = counted ? f / counted * 100 : 0, pm = counted ? m / counted * 100 : 0;
    return `<div class="stat"><span class="ico">${names[h][1]}</span><b>${names[h][0]}</b><em>${f + m} de ${counted} ${counted === 1 ? 'día' : 'días'}</em>
      <div class="bar"><i class="f" style="width:${pf}%;animation-delay:${i * 120}ms"></i><i class="m" style="width:${pm}%;animation-delay:${i * 120 + 200}ms"></i></div></div>`;
  }).join('');
  const hh = Math.floor(estMin / 60), mm = estMin % 60, studyTxt = hh ? `${hh} h ${mm}` : `${mm} min`;
  const head = ended
    ? `<div class="endcard"><h3>Ciclo ${S.cycle} terminado.</h3><p>Mira cómo ha ido. Cuando quieras, empieza el siguiente: tus datos se quedan guardados.</p><button data-a="newCycle">Empezar ciclo ${S.cycle + 1}</button></div>`
    : `<p class="sub">Semana ${week} de 4. ${28 - dayN === 0 ? 'Hoy es el último día.' : `Faltan ${28 - dayN} días.`} Al cerrarlo decides si mantienes o ajustas.</p><div class="prog"><i style="width:${dayN / 28 * 100}%"></i></div>`;
  const notes = S.notes.length
    ? S.notes.map(n => `<p>«${esc(n.text)}»</p>`).join('')
    : '<p class="foot" style="border:0">Aún no hay ninguna. Aparecen cuando escribes una frase en el cierre de un buen día.</p>';
  $('#v-ciclo').innerHTML = `<div class="top"></div><h2 class="h">Ciclo ${S.cycle}</h2>${head}
    <div class="mosaic">${cells}</div>
    <div class="sec"><h3>Constancia</h3>${stats}<p class="foot">Azul intenso, versión completa. Azul claro, mínimo: cuenta igual. Nada vuelve a cero.</p></div>
    <div class="sec"><h3>Acumulado</h3><div class="tiles">
      <div class="tile"><b>${studyTxt}</b><span>de estudio</span></div>
      <div class="tile"><b>${bici + gym}</b><span>${bici} bici, ${gym} gimnasio</span></div>
      <div class="tile"><b>${tot ? Math.round(aq / tot * 100) + ' %' : '—'}</b><span>de veces, aquí</span></div></div></div>
    <div class="sec"><h3>En espera</h3><div class="wait"><span>${ICON.lock}Leer</span><span>${ICON.lock}Piano</span></div>
      <p class="foot">Esperan a que los tres hábitos de ahora se sostengan solos.</p></div>
    <div class="sec notes"><h3>Notas de tus días buenos</h3>${notes}</div>
    <div class="sec"><h3>Tus datos</h3><p class="foot" style="margin:0 0 10px">Se guardan solo en este iPhone. Haz una copia de vez en cuando y pégala en Notas.</p>
      <div class="row2"><button class="sbtn" data-a="backup">Copiar copia de seguridad</button><button class="sbtn" data-a="restore">Restaurar</button></div></div>`;
}

/* ---------- Navegación ---------- */
let tab = 'hoy';
const ORDER = ['hoy', 'semana', 'ciclo'];
function go(t) {
  if (t === 'semana') renderSemana();
  if (t === 'ciclo') renderCiclo();
  if (t === 'hoy') renderHoy();
  if (t === tab) return;
  const to = ORDER.indexOf(t);
  ORDER.forEach((x, i) => { const v = $('#v-' + x); v.classList.toggle('on', x === t); v.classList.toggle('left', i < to); });
  document.querySelectorAll('.navb').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('#v-' + t).scrollTop = 0;
  tab = t;
}
function renderAll() { renderHoy(); if (tab === 'semana') renderSemana(); if (tab === 'ciclo') renderCiclo(); }

/* ---------- Hojas, capas, avisos ---------- */
function sheet(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet').scrollTop = 0; $('#sheet').classList.add('on'); $('#backdrop').classList.add('on'); }
function closeSheet() { $('#sheet').classList.remove('on'); $('#backdrop').classList.remove('on'); }
const sheetOpen = () => $('#sheet').classList.contains('on');
let ovKind = '';
function ov(html, kind = '', cls = '') { const o = $('#ov'); o.className = 'ov on ' + cls; o.innerHTML = html; o.scrollTop = 0; ovKind = kind; }
function closeOv() { $('#ov').className = 'ov'; ovKind = ''; stopLoops(); }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const CLOSE = '<div class="ovh"><button class="x" data-a="closeOv">Cerrar</button></div>';

function setHabit(h, v, opts = {}) {
  const r = rec(opts.day || TK);
  r.h[h] = v;
  if (h === 'mov' && v) r.movType = movFor(opts.day || TK);
  if (h === 'est') r.estMin = v ? (opts.mins || (v === 'full' ? 50 : 10)) : 0;
  save(); renderAll();
  if (!opts.quiet) toast(v === 'full' ? 'Hecho.' : v === 'min' ? 'Mínimo hecho. Cuenta igual.' : 'Desmarcado.');
}
function habitSheet(h) {
  const v = T().h[h], inf = habitInfo(h);
  let o = '';
  if (h === 'est') o += `<button class="opt pri" data-a="study">Empezar temporizador<small>se registra solo</small></button>`;
  o += `<button class="opt" data-a="mark" data-h="${h}" data-v="full">Hecho, completo<small>${inf.full}</small></button>`;
  o += `<button class="opt" data-a="mark" data-h="${h}" data-v="min">Hecho, mínimo<small>${inf.min}</small></button>`;
  if (h === 'mov' && !v) o += `<button class="opt" data-a="swapMov">Hoy mejor ${movFor(TK) === 'bici' ? 'gimnasio' : 'bici'}<small>se reajusta solo</small></button>`;
  if (v) o += `<button class="opt ghost" data-a="mark" data-h="${h}" data-v="">Desmarcar</button>`;
  sheet(`<h3>${inf.name}</h3><p class="sp">${esc(inf.sub)}</p><div class="opts">${o}</div>`);
}

/* ---------- Temporizador de estudio (sobrevive a cerrar la app) ---------- */
let raf = null, breathT = null;
function stopLoops() { cancelAnimationFrame(raf); raf = null; clearTimeout(breathT); breathT = null; }
const elapsedOf = tm => Math.max(0, ((tm.pausedAt || Date.now()) - tm.start - tm.paused) / 1000);
function study() {
  closeSheet();
  if (!S.timer) { S.timer = { start: Date.now(), paused: 0, pausedAt: null, day: TK }; save(); }
  openTimer();
}
function openTimer() {
  const tm = S.timer, s = S.plan[fromKey(tm.day).getDay()] || '', RR = 112, CC = 2 * Math.PI * RR;
  let minShown = false;
  ov(`<div class="ovh"></div>
    <h2>${s ? esc(s) : 'Estudio'}</h2><p class="sp">Bloque de 50 minutos. Con 10 ya cuenta.</p>
    <div class="grow"><div class="tring"><svg viewBox="0 0 250 250"><circle cx="125" cy="125" r="${RR}" fill="none" stroke="var(--line)" stroke-width="8"/>
      <circle id="tp" cx="125" cy="125" r="${RR}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${CC}" stroke-dashoffset="${CC}"/></svg>
      <div class="t"><b id="tt">50:00</b><span id="ts">${tm.pausedAt ? 'en pausa' : 'en marcha'}</span></div></div>
      <div class="minok" id="minok">Mínimo conseguido</div></div>
    <div class="actions"><button id="tpause" data-a="studyPause">${tm.pausedAt ? 'Seguir' : 'Pausar'}</button><button class="pri" data-a="studyEnd">Terminar</button></div>`, 'timer');
  const loop = () => {
    if (!S.timer || ovKind !== 'timer') return;
    const el = Math.min(STUDY_FULL, elapsedOf(S.timer)), left = STUDY_FULL - el;
    $('#tt').textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(Math.floor(left % 60)).padStart(2, '0')}`;
    $('#tp').setAttribute('stroke-dashoffset', CC * (1 - el / STUDY_FULL));
    if (el >= STUDY_MIN && !minShown) { minShown = true; $('#minok').classList.add('on'); }
    if (el >= STUDY_FULL) return finishStudy();
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}
function studyPause() {
  const tm = S.timer; if (!tm) return;
  if (tm.pausedAt) { tm.paused += Date.now() - tm.pausedAt; tm.pausedAt = null; } else tm.pausedAt = Date.now();
  save();
  $('#tpause').textContent = tm.pausedAt ? 'Seguir' : 'Pausar';
  $('#ts').textContent = tm.pausedAt ? 'en pausa' : 'en marcha';
}
function finishStudy(silent) {
  const tm = S.timer; if (!tm) return;
  const el = Math.min(STUDY_FULL, elapsedOf(tm)), mins = Math.round(el / 60);
  S.timer = null; save();
  if (ovKind === 'timer') closeOv();
  if (el >= STUDY_FULL) setHabit('est', 'full', { mins: 50, day: tm.day, quiet: true });
  else if (el >= STUDY_MIN) setHabit('est', 'min', { mins, day: tm.day, quiet: true });
  if (!silent) toast(el >= STUDY_FULL ? 'Bloque completo. 50 minutos.' : el >= STUDY_MIN ? `${mins} min. Mínimo hecho, cuenta igual.` : `${mins} min. No llega al mínimo, pero has empezado.`);
}

/* ---------- Vuelve ---------- */
let vfeel = '';
function vuelve() {
  closeSheet();
  ov(`${CLOSE}<div class="step"><h2>¿Qué sientes ahora?</h2><p class="sp">Una palabra. Nombrarlo ya ayuda.</p>
    <div class="grow"><div class="chips">${FEEL.slice(0, 8).map(f => `<button class="chip" data-a="vfeel" data-w="${f}">${f}</button>`).join('')}</div>
    <input class="field" id="vother" placeholder="Otra palabra" aria-label="Otra palabra" autocomplete="off"></div>
    <div class="actions"><button class="pri" data-a="vfeel" data-w="">Seguir</button></div></div>`, 'vuelve');
}
function vBreath(w) {
  vfeel = w;
  ov(`${CLOSE}<div class="step"><h2>${w ? esc(w) + '. Lo has nombrado.' : 'Vale.'}</h2><p class="sp">Ahora, tres respiraciones.</p>
    <div class="grow"><div class="orbwrap"><div class="orb" id="orb"></div></div><div class="blabel" id="bl">Inhala</div><div class="bmeta" id="bm">1 de 3</div></div></div>`, 'vuelve');
  let n = 0; const orb = $('#orb'), bl = $('#bl'), bm = $('#bm');
  const cyc = () => {
    if (ovKind !== 'vuelve') return;
    orb.style.transition = 'transform 4s cubic-bezier(.45,0,.55,1)'; orb.style.transform = 'scale(1)'; bl.textContent = 'Inhala';
    breathT = setTimeout(() => {
      orb.style.transition = 'transform 5s cubic-bezier(.45,0,.55,1)'; orb.style.transform = 'scale(.5)'; bl.textContent = 'Suelta';
      breathT = setTimeout(() => { n++; if (n >= 3) return vAct(); bm.textContent = `${n + 1} de 3`; cyc(); }, 5000);
    }, 4000);
  };
  requestAnimationFrame(() => requestAnimationFrame(cyc));
}
function vAct() {
  ov(`${CLOSE}<div class="step"><h2>Elige algo de 2 minutos.</h2><p class="sp">Solo eso. Lo siguiente, después.</p>
    <div class="grow" style="align-items:stretch"><div class="opts">${ACTS.map(a => `<button class="opt" data-a="vdone" data-w="${a}">${a}</button>`).join('')}</div></div></div>`, 'vuelve');
}
function vDone(a) {
  T().pres.push({ t: 'aqui', w: vfeel, via: 'vuelve', at: Date.now() }); save();
  ov(`<div class="step"><div class="grow"><div class="orbwrap"><div class="orb" style="transform:scale(.8);transition:transform 1.2s var(--spring)"></div></div>
    <h2 class="ctr" style="margin-top:28px">Estás aquí.</h2><p class="sp ctr">${esc(a)}. Ve a ello.</p></div>
    <div class="actions"><button class="pri" data-a="closeOvHoy">Volver a Hoy</button></div></div>`, 'vuelve');
}

/* ---------- ¿Estás aquí? ---------- */
function checkin() {
  if (T().pause) return toast('Hoy está en pausa.');
  S.lastPrompt = Date.now(); save();
  sheet(`<h3>¿Estás aquí?</h3><p class="sp">Sin pensarlo mucho. ¿Tu atención está en lo que haces?</p>
    <div class="big2"><button data-a="pres" data-t="aqui">Aquí</button><button data-a="pres" data-t="lejos">Lejos</button></div>`);
}
let presT = '';
function presWord(t) {
  presT = t;
  sheet(`<h3>${t === 'aqui' ? 'Bien.' : 'Vale, lo has notado.'}</h3><p class="sp">¿Una palabra para lo que sientes?</p>
    <div class="chips">${FEEL.map(f => `<button class="chip" data-a="presSave" data-w="${f}">${f}</button>`).join('')}</div>
    <div class="opts" style="margin-top:14px">${t === 'lejos' ? '<button class="opt pri" data-a="presVuelve">Hacer Vuelve<small>1 minuto</small></button>' : ''}<button class="opt ghost" data-a="presSave" data-w="">Saltar</button></div>`);
}
function presSave(w) {
  T().pres.push({ t: presT, w, at: Date.now() }); save(); closeSheet();
  go('hoy');
  toast(presT === 'aqui' ? 'Anotado. Un punto más en tu día.' : 'Anotado. Notarlo ya es volver.');
}
function maybePrompt() {
  // Si abres Ciclo por la tarde (tras un aviso), la pregunta te espera. Máximo dos al día.
  const h = new Date().getHours(), t = T();
  if (h < 15 || h >= 21 || t.pause || ovKind || sheetOpen() || !S.welcomed) return;
  const asked = t.pres.filter(p => p.via !== 'vuelve');
  const last = Math.max(S.lastPrompt || 0, ...asked.map(p => p.at || 0));
  if (asked.length < 2 && Date.now() - last > 75 * 60e3) setTimeout(checkin, 600);
}

/* ---------- Cierre ---------- */
function cierre() {
  closeSheet();
  const t = T(), pend = HK.filter(h => !t.h[h]);
  const rows = pend.map(h => `<div style="margin-bottom:12px"><b style="font-weight:600">${habitInfo(h).name}</b>
    <div class="chips" style="margin-top:6px"><button class="chip" data-a="cmark" data-h="${h}" data-v="full">Completo</button><button class="chip" data-a="cmark" data-h="${h}" data-v="min">Mínimo</button><button class="chip" data-a="cmark" data-h="${h}" data-v="">No</button></div></div>`).join('');
  ov(`${CLOSE}<div class="step"><h2>Cierre del día</h2><p class="sp">Treinta segundos.</p>
    <div style="margin-top:22px">${rows || '<p style="color:var(--muted)">Los tres hábitos están hechos.</p>'}</div>
    <label for="cline" style="font-weight:600;display:block;margin-top:10px">¿Qué momento de hoy viviste de verdad?</label>
    <input class="field" id="cline" placeholder="Una línea" value="${esc(t.line || '')}" autocomplete="off">
    <div id="goodWrap"></div>
    <div style="flex:1;min-height:20px"></div>
    <div class="actions"><button class="pri" data-a="cierreSave">Cerrar el día</button></div></div>`, 'cierre');
  goodPrompt();
}
function goodPrompt() {
  const w = $('#goodWrap'); if (!w || w.innerHTML) return;
  if (done(T()) >= 2) w.innerHTML = `<label for="cgood" style="font-weight:600;display:block;margin-top:18px">Hoy ha ido bien. ¿Una frase para tu yo de un día malo?</label><input class="field" id="cgood" placeholder="Opcional" autocomplete="off">`;
}

/* ---------- Noche ---------- */
function night() {
  closeSheet();
  ov(`<div class="step"><div class="grow"><div class="moon"></div><h2 class="ctr">Mañana.</h2>
    <p class="sp ctr">Descansa. Ciclo está en silencio hasta mañana.</p></div>
    <button class="open" data-a="nightOpen">Abrir igualmente</button></div>`, 'night', 'night');
}
function checkNight() {
  if (isNightHour() && nightBypassDay !== TK && !S.timer && ovKind !== 'night' && S.welcomed) night();
  if (!isNightHour() && ovKind === 'night') closeOv();
}

/* ---------- Bienvenida ---------- */
function welcome() {
  ov(`<div class="step welcome"><div class="ovh"></div><h2>Esto es Ciclo.</h2><p class="sp">Tres hábitos al día, ciclos de cuatro semanas y nada que vuelva a cero.</p>
    <ul>
      <li><span class="hicon">${ICON.med}</span><span><b>Meditar</b><span>Con el café. 5 min, o 3 respiraciones.</span></span></li>
      <li><span class="hicon">${ICON.est}</span><span><b>Estudio</b><span>Después de comer. 50 min, o 10.</span></span></li>
      <li><span class="hicon">${ICON.bici}</span><span><b>Bici y gimnasio</b><span>Se alternan. El mínimo, 15 min.</span></span></li>
    </ul>
    <p style="font-weight:600;margin-top:28px">¿Qué toca hoy de movimiento?</p>
    <div class="chips" style="margin-top:10px"><button class="chip sel" data-a="firstMov" data-w="bici">Bici</button><button class="chip" data-a="firstMov" data-w="gym">Gimnasio</button></div>
    <div style="flex:1;min-height:24px"></div>
    <div class="actions"><button class="pri" data-a="start">Empezar el ciclo 1</button></div></div>`, 'welcome');
}

/* ---------- Copia de seguridad ---------- */
async function backup() {
  const txt = JSON.stringify(S);
  try { await navigator.clipboard.writeText(txt); toast('Copia copiada. Pégala en Notas.'); }
  catch (e) {
    sheet(`<h3>Copia de seguridad</h3><p class="sp">Selecciona todo el texto, cópialo y guárdalo en Notas.</p><textarea class="field" readonly>${esc(txt)}</textarea>`);
  }
}
function restoreSheet() {
  sheet(`<h3>Restaurar</h3><p class="sp">Pega aquí una copia de seguridad. Sustituye los datos actuales.</p>
    <textarea class="field" id="rtxt" placeholder="Pega la copia" autocomplete="off"></textarea>
    <div class="opts" style="margin-top:12px"><button class="opt pri" data-a="doRestore">Restaurar datos</button></div>`);
}
function doRestore() {
  try {
    const x = JSON.parse($('#rtxt').value);
    if (!x || !x.days || x.v !== 1) throw 0;
    S = Object.assign(fresh(), x); S.lastOpen = TK; save(); closeSheet(); renderAll(); toast('Datos restaurados.');
  } catch (e) { toast('Ese texto no es una copia de Ciclo. Revisa que esté entero.'); }
}

/* ---------- Eventos ---------- */
const A = {
  tab: b => { closeSheet(); go(b.dataset.t); },
  habit: b => habitSheet(b.dataset.h),
  mark: b => { closeSheet(); setHabit(b.dataset.h, b.dataset.v || null); },
  swapMov: () => { const t = T(); t.movOverride = movFor(TK) === 'bici' ? 'gym' : 'bici'; save(); closeSheet(); renderAll(); toast(`Hoy, ${MOV[t.movOverride].name.toLowerCase()}.`); },
  closeSheet, closeOv,
  closeOvHoy: () => { closeOv(); go('hoy'); },
  study,
  studyPause,
  studyEnd: () => finishStudy(),
  vuelve,
  vfeel: b => vBreath(b.dataset.w || (($('#vother') && $('#vother').value.trim()) || '')),
  vdone: b => vDone(b.dataset.w),
  checkin,
  pres: b => presWord(b.dataset.t),
  presSave: b => presSave(b.dataset.w),
  presVuelve: () => { T().pres.push({ t: 'lejos', w: '', at: Date.now() }); save(); updateRing(); vuelve(); },
  pause: () => sheet(`<h3>Pausar hoy</h3><p class="sp">Un día en pausa no cuenta como fallo. Para cuando estás enfermo, en exámenes o pasa algo.</p>
    <div class="chips">${['Enfermo', 'Exámenes', 'Algo personal', 'Viaje'].map(r => `<button class="chip" data-a="doPause" data-w="${r}">${r}</button>`).join('')}</div>
    <div class="opts" style="margin-top:14px"><button class="opt pri" data-a="doPause" data-w="">Pausar sin motivo</button></div>`),
  doPause: b => { const t = T(); t.pause = true; t.reason = b.dataset.w; save(); closeSheet(); renderAll(); toast('Día en pausa.'); },
  unpause: () => { T().pause = false; save(); renderAll(); },
  showAll: () => { showAll = true; renderHoy(); },
  cierre,
  cmark: b => {
    const h = b.dataset.h, v = b.dataset.v || null, r = T();
    r.h[h] = v; if (h === 'mov' && v) r.movType = movFor(TK); if (h === 'est') r.estMin = v ? (v === 'full' ? 50 : 10) : 0;
    save(); b.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('sel', c === b)); updateRing(); goodPrompt();
  },
  cierreSave: () => {
    const t = T(); t.line = ($('#cline').value || '').trim(); t.closed = true;
    const g = $('#cgood'); if (g && g.value.trim()) S.notes.push({ text: g.value.trim(), day: TK });
    save(); closeOv(); renderAll(); toast('Día cerrado. Buenas noches.');
  },
  nightOpen: () => { nightBypassDay = TK; closeOv(); renderAll(); },
  firstMov: b => { S.firstMov = b.dataset.w; b.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('sel', c === b)); },
  start: () => { S.welcomed = true; S.since = TK; S.cycleStart = TK; save(); closeOv(); renderAll(); },
  newCycle: () => { S.cycle += 1; S.cycleStart = TK; save(); renderAll(); toast(`Ciclo ${S.cycle} empieza hoy.`); },
  backup, restore: restoreSheet, doRestore
};
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) A[b.dataset.a](b, e); });
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.wd !== undefined) { S.plan[e.target.dataset.wd] = e.target.value.trim(); save(); renderHoy(); toast('Plan guardado.'); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.dmid input')) e.target.blur(); });

/* ---------- Inicio y vuelta a la app ---------- */
function onOpen() {
  const k = key(day0());
  if (k !== TK) { TODAY = day0(); TK = k; showAll = false; lastDone = -1; }
  if (S.lastOpen && S.welcomed && diff(fromKey(S.lastOpen), TODAY) >= 4) S.reentry = { start: TK, until: key(add(TODAY, 2)) };
  S.lastOpen = TK; save();
  if (S.timer) {
    if (elapsedOf(S.timer) >= STUDY_FULL || S.timer.day !== TK) finishStudy();
    else if (ovKind !== 'timer') openTimer();
  }
  renderAll();
  checkNight();
  maybePrompt();
}
S = load();
buildRing();
renderHoy();
lastDone = done(T());
requestAnimationFrame(() => {
  HK.forEach(h => { const el = $('#f-' + h); el.style.transition = 'none'; el.setAttribute('stroke-dashoffset', SEG); });
  void document.body.offsetWidth;
  HK.forEach((h, i) => { const el = $('#f-' + h); el.style.transition = ''; el.style.transitionDelay = (300 + i * 180) + 'ms'; });
  updateRing();
  setTimeout(() => HK.forEach(h => { $('#f-' + h).style.transitionDelay = ''; }), 1600);
});
if (!S.welcomed) welcome(); else onOpen();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') onOpen(); });
setInterval(() => { if (document.visibilityState === 'visible' && key(day0()) !== TK) onOpen(); else checkNight(); }, 60e3);

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
